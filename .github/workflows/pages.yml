name: Build and deploy websites

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.github-pages-deployment.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check deployment configuration
        id: configuration
        shell: python
        run: |
          import os
          settings = {
              "CLOUDFLARE_PAGES_DEPLOY_API_TOKEN": "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_ACCOUNT_ID": "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_PAGES_PROJECT_NAME": "CLOUDFLARE_PAGES_PROJECT_NAME",
          }
          missing = [name for name, variable in settings.items() if not os.environ.get(variable)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=" + str(not missing).lower() + "\n")
          if missing:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("Cloudflare deployment is not configured; GitHub Pages will publish the GitHub download fallback.\n\n")
                  summary.write("Missing settings: " + ", ".join(missing) + ". See docs/UPDATES.md.\n")
      - name: Check website tooling
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          node --check website/script.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build configured release website
        if: steps.configuration.outputs.ready == 'true'
        run: >-
          python3 .github/scripts/build_website.py
          --metadata-url https://download.miofelix.com/bucea-library-seat/releases/latest.json
          --output dist/website
      - name: Build website before R2 activation
        if: steps.configuration.outputs.ready != 'true'
        run: python3 .github/scripts/build_website.py --output dist/website
      - name: Verify selected public downloads
        if: steps.configuration.outputs.ready == 'true'
        run: python3 .github/scripts/verify_downloads.py --metadata dist/website/release.json
      - name: Upload reviewable website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/website
      - name: Upload GitHub Pages website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website
      - name: Deploy Cloudflare Pages
        if: steps.configuration.outputs.ready == 'true'
        run: >-
          npx --yes wrangler@4 pages deploy dist/website
          --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch main
      - name: Deploy GitHub Pages
        id: github-pages-deployment
        uses: actions/deploy-pages@v4
